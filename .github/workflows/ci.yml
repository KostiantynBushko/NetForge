name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      # The project is written by hand, not by a formatter, so ruff is
      # asked what is wrong rather than how it would be laid out.
      - name: ruff
        run: ruff check .

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Every extra is installed, because the adapters that need them
      # are part of the framework and are tested like the rest of it.
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pytest pytest-asyncio

      - name: the test suite
        run: python -m pytest -q

      # The documentation is derived from the code, so a change that
      # leaves it behind is a change that is not finished.
      - name: the documentation is up to date
        run: |
          python tools/generate_docs.py
          git diff --exit-code

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip build

      - name: build the distribution
        run: python -m build --outdir dist .

      # The wheel is installed on its own, without the extras, so that
      # the claim that the core needs nothing but Pydantic is checked
      # rather than believed.
      - name: the wheel installs and answers
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --upgrade pip
          /tmp/check/bin/pip install dist/*.whl
          /tmp/check/bin/netforge list
          /tmp/check/bin/python -c "import netforge; print(netforge.__name__)"
